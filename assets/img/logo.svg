<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Annapoorna">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b1017"/>
      <stop offset="1" stop-color="#e63946"/>
    </linearGradient>
  </defs>

  <!-- embracing arms: two adults cradling the child -->
  <path d="M62 74 C 38 96, 40 132, 96 160" fill="none" stroke="url(#ag)" stroke-width="20" stroke-linecap="round"/>
  <path d="M138 74 C 162 96, 160 132, 104 160" fill="none" stroke="url(#ag)" stroke-width="20" stroke-linecap="round"/>

  <!-- gold accents between adults and child -->
  <path d="M84 120c-5 9-5 22 0 33 5-11 5-24 0-33z" fill="#e8a33d"/>
  <path d="M116 120c5 9 5 22 0 33-5-11-5-24 0-33z" fill="#e8a33d"/>

  <!-- child -->
  <path d="M100 105c-11 0-18 9-18 21v24c0 6 5 11 11 11h14c6 0 11-5 11-11v-24c0-12-7-21-18-21z" fill="#e63946"/>
  <circle cx="100" cy="90" r="15" fill="#e63946"/>

  <!-- adult heads -->
  <circle cx="62" cy="56" r="18" fill="#e63946"/>
  <circle cx="138" cy="56" r="18" fill="#e63946"/>
</svg>
